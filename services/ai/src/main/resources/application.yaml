spring:
  application:
    name: service-ai

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      connection-timeout: 3000
      minimum-idle: 4
      maximum-pool-size: 24
      idle-timeout: 30000
      username: ${DATABASE_USERNAME}
      password: ${DATABASE_PASSWORD}
    url: ${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/zhihuidangjian?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: ${REDIS_DATABASE}
  ai:
    # 显式选择模型实现：chat 经 OpenAI 兼容协议调用 DeepSeek（bean 名 openAiChatModel，
    # 模型 id deepseek-v4-flash 即 DeepSeek-V4-Flash-0731），embedding 留在 DashScope；
    # 语音、图像、审核子模型无人使用，保持禁用。
    model:
      chat: openai
      embedding: dashscope
      audio:
        speech: none
        transcription: none
      moderation: none
      image: none
    openai:
      base-url: https://api.deepseek.com
      api-key: ${AI_KEY:dummy-key}
      chat:
        options:
          model: ${AI_MODEL:deepseek-v4-flash}
          temperature: ${AI_TEMPERATURE:0.7}
    dashscope:
      api-key: ${AI_EMBEDDING_KEY:${AI_KEY:dummy-key}}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:qwen3.7-text-embedding}
    mcp:
      client:
        enabled: ${AI_MCP_ENABLED:false}
