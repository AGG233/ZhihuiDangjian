spring:
  application:
    name: service-ai

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      connection-timeout: 3000
      minimum-idle: 4
      maximum-pool-size: 24
      idle-timeout: 30000
      username: ${DATABASE_USERNAME}
      password: ${DATABASE_PASSWORD}
    url: ${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/zhihuidangjian?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: ${REDIS_DATABASE}
  ai:
    # 显式选择模型实现：Agent 编排与出题工具均绑定 @Qualifier("dashScopeChatModel")，
    # chat/embedding 收敛到 DashScope，其余无人使用的 OpenAI 子模型（语音、图像、审核）全部禁用，
    # 避免自动配置因缺少 spring.ai.openai.api-key 在启动时抛出断言异常。
    model:
      chat: dashscope
      embedding: dashscope
      audio:
        speech: none
        transcription: none
      moderation: none
      image: none
    dashscope:
      api-key: ${AI_EMBEDDING_KEY:${AI_KEY:dummy-key}}
    mcp:
      client:
        enabled: ${AI_MCP_ENABLED:false}
