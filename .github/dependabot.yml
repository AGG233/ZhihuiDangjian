version: 2
updates:
  # Gradle dependencies
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - java
    commit-message:
      prefix: deps
      include: scope
    groups:
      spring:
        patterns:
          - 'org.springframework*'
          - 'org.springframework.boot*'
          - 'io.spring.dependency-management'
        update-types:
          - patch
          - minor
      spotless:
        patterns:
          - 'com.diffplug.spotless*'
      testing:
        patterns:
          - 'org.junit*'
          - 'org.mockito*'
          - 'org.assertj*'

  # Docker base image
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: deps
      include: scope

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
