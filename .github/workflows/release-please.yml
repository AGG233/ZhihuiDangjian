name: release-please
on:
  push:
    branches:
      - product
  workflow_dispatch:

concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        id: release
        with:
          token: ${{ secrets.GH_PAT }}

      # Auto-merge Release PR for fully automated flow.
      # Uses GH_PAT (not GITHUB_TOKEN) so the merge commit triggers
      # a new workflow run, which then creates the release + tag.
      - name: Auto-merge Release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          PR="${{ steps.release.outputs.pr }}"
          for attempt in 1 2 3 4 5; do
            if gh pr merge --merge "$PR" --subject "chore: auto-merge release PR"; then
              echo "✅ Release PR #${PR} merged successfully"
              exit 0
            fi
            echo "⏳ Attempt ${attempt} failed, retrying in 3s..."
            sleep 3
          done
          echo "ERROR: Failed to merge Release PR #${PR} after 5 attempts"
          exit 1

  # ── Build & Push Docker Image ───────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      registry: ${{ steps.image.outputs.registry }}
      image_repository: ${{ steps.image.outputs.image_repository }}
      ghcr_image_repository: ${{ steps.image.outputs.ghcr_image_repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using version: ${VERSION}"

      - name: Resolve Aliyun image
        id: image
        shell: bash
        env:
          ALIYUN_IMAGE_REPOSITORY: ${{ vars.ALIYUN_IMAGE_REPOSITORY }}
          ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ vars.ALIYUN_NAMESPACE }}
          ALIYUN_REPOSITORY: ${{ vars.ALIYUN_REPOSITORY }}
          ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in ALIYUN_REGISTRY_USERNAME ALIYUN_REGISTRY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: ${name} is required for Aliyun image publishing."
              exit 1
            fi
          done

          if [ -n "${ALIYUN_IMAGE_REPOSITORY:-}" ]; then
            IMAGE_REPOSITORY="${ALIYUN_IMAGE_REPOSITORY#https://}"
            IMAGE_REPOSITORY="${IMAGE_REPOSITORY#http://}"
            IMAGE_REPOSITORY="${IMAGE_REPOSITORY%/}"
            REGISTRY="${IMAGE_REPOSITORY%%/*}"
          else
            for name in ALIYUN_REGISTRY ALIYUN_NAMESPACE ALIYUN_REPOSITORY; do
              if [ -z "${!name:-}" ]; then
                echo "ERROR: ${name} is required when ALIYUN_IMAGE_REPOSITORY is not set."
                exit 1
              fi
            done

            REGISTRY="${ALIYUN_REGISTRY#https://}"
            REGISTRY="${REGISTRY#http://}"
            REGISTRY="${REGISTRY%/}"
            NAMESPACE="${ALIYUN_NAMESPACE#/}"
            NAMESPACE="${NAMESPACE%/}"
            REPOSITORY="${ALIYUN_REPOSITORY#/}"
            REPOSITORY="${REPOSITORY%/}"
            IMAGE_REPOSITORY="${REGISTRY}/${NAMESPACE}/${REPOSITORY}"
          fi

          if [ "$REGISTRY" = "$IMAGE_REPOSITORY" ]; then
            echo "ERROR: Aliyun image repository must include registry, namespace, and repository."
            exit 1
          fi

          GHCR_IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zhihuidangjian"

          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "image_repository=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image_repository=${GHCR_IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "Using image repository: ${IMAGE_REPOSITORY}"
          echo "Using GHCR image repository: ${GHCR_IMAGE_REPOSITORY}"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build application jar
        run: ./gradlew :server:bootJar --no-daemon -x test -x integrationTest -x spotlessCheck

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Login to GHCR
        id: ghcr-login
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.image.outputs.image_repository }}
            ${{ steps.ghcr-login.outcome == 'success' && steps.image.outputs.ghcr_image_repository || '' }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push Docker image (Aliyun ACR${{ steps.ghcr-login.outcome == 'success' && ' + GHCR' || ' (GHCR skipped)' }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image_repository }}:${{ steps.meta.outputs.version }}
            ${{ steps.image.outputs.image_repository }}:latest
            ${{ steps.ghcr-login.outcome == 'success' && format('{0}:{1}', steps.image.outputs.ghcr_image_repository, steps.meta.outputs.version) || '' }}
            ${{ steps.ghcr-login.outcome == 'success' && format('{0}:latest', steps.image.outputs.ghcr_image_repository) || '' }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=min

  trivy-scan:
    name: Scan Docker Image
    needs: [ build-and-push ]
    if: ${{ needs.build-and-push.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ needs.build-and-push.outputs.registry }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build-and-push.outputs.image_repository }}:${{ needs.build-and-push.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ── Trigger CD ──────────────────────────────────────────────────────
  trigger-cd:
    name: Trigger CD
    needs: [build-and-push, trivy-scan]
    if: ${{ always() && needs.build-and-push.result == 'success' && needs.trivy-scan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CD deployment via workflow_dispatch
        run: |
          gh workflow run cd.yml \
            --ref product \
            -f version='${{ needs.build-and-push.outputs.version }}'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
