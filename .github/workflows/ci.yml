name: CI

on:
  pull_request:
    branches:
      - product
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-and-format:
    name: Compile & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Compile sources and check formatting
        run: ./gradlew compileJava spotlessCheck

      - name: Upload compile reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-format-reports
          path: |
            **/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

  service-unit-tests:
    name: Service Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run service unit tests
        run: ./gradlew test -x :server:test --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-unit-test-reports
          path: |
            services/**/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Package unit coverage data
        if: success()
        run: |
          mapfile -t coverage_files < <(find services -path '*/build/jacoco/test.exec' -type f | sort)
          if [ "${#coverage_files[@]}" -eq 0 ]; then
            echo "No JaCoCo unit coverage data found"
            exit 1
          fi
          tar -cf service-unit-coverage-exec.tar "${coverage_files[@]}"

      - name: Upload unit coverage data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: service-unit-coverage-exec
          path: service-unit-coverage-exec.tar
          if-no-files-found: error
          retention-days: 7

  server-unit-tests:
    name: Server Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run server unit tests
        run: ./gradlew :server:test --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-unit-test-reports
          path: |
            server/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Package unit coverage data
        if: success()
        run: |
          if [ ! -f server/build/jacoco/test.exec ]; then
            echo "No server JaCoCo unit coverage data found"
            exit 1
          fi
          tar -cf server-unit-coverage-exec.tar server/build/jacoco/test.exec

      - name: Upload unit coverage data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: server-unit-coverage-exec
          path: server-unit-coverage-exec.tar
          if-no-files-found: error
          retention-days: 7

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [service-unit-tests, server-unit-tests]
    if: always()

    steps:
      - name: Check unit test jobs
        run: |
          if [ "${{ needs.service-unit-tests.result }}" != "success" ] || [ "${{ needs.server-unit-tests.result }}" != "success" ]; then
            echo "Service unit tests: ${{ needs.service-unit-tests.result }}"
            echo "Server unit tests: ${{ needs.server-unit-tests.result }}"
            exit 1
          fi

  integration-and-smoke:
    name: Integration, Coverage & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [compile-and-format, unit-test]
    env:
      MYSQL_IMAGE: public.ecr.aws/docker/library/mysql:8.4
      REDIS_IMAGE: public.ecr.aws/docker/library/redis:7-alpine
      NEO4J_IMAGE: public.ecr.aws/docker/library/neo4j:5-community

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Start dependency containers
        run: |
          set -euo pipefail

          pull_with_retry() {
            local image="$1"
            for attempt in 1 2 3 4 5; do
              if docker pull "$image"; then
                return 0
              fi
              sleep $((attempt * 5))
            done
            return 1
          }

          pull_with_retry "$MYSQL_IMAGE"
          pull_with_retry "$REDIS_IMAGE"
          pull_with_retry "$NEO4J_IMAGE"

          docker run -d --name zhdj-ci-mysql \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=zhdj \
            -p 3306:3306 \
            --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot" \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=10 \
            --memory=1g \
            "$MYSQL_IMAGE"

          docker run -d --name zhdj-ci-redis \
            -p 6379:6379 \
            --health-cmd="redis-cli ping" \
            --health-interval=5s \
            --health-timeout=3s \
            --health-retries=10 \
            --memory=256m \
            "$REDIS_IMAGE"

          docker run -d --name zhdj-ci-neo4j \
            -e NEO4J_AUTH=none \
            -e NEO4J_server_memory_heap_max__size=512m \
            -p 7687:7687 \
            --health-cmd="cypher-shell 'RETURN 1'" \
            --health-interval=10s \
            --health-timeout=10s \
            --health-retries=15 \
            --health-start-period=30s \
            --memory=2g \
            "$NEO4J_IMAGE"

          for container in zhdj-ci-mysql zhdj-ci-redis zhdj-ci-neo4j; do
            for attempt in $(seq 1 60); do
              status="$(docker inspect --format='{{.State.Health.Status}}' "$container")"
              if [ "$status" = healthy ]; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                docker logs "$container" || true
                exit 1
              fi
              sleep 2
            done
          done

      - name: Download service unit coverage data
        uses: actions/download-artifact@v4
        with:
          name: service-unit-coverage-exec
          path: .

      - name: Download server unit coverage data
        uses: actions/download-artifact@v4
        with:
          name: server-unit-coverage-exec
          path: .

      - name: Restore unit coverage data
        run: |
          tar -xf service-unit-coverage-exec.tar
          tar -xf server-unit-coverage-exec.tar

      - name: Run integration tests and coverage
        run: ./gradlew jacocoRootReport jacocoRootCoverageVerification -PcoverageFromUnitArtifacts=true --continue

      - name: Upload coverage to Codacy
        if: success() || failure()
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml
          language: java
          force-coverage-parser: jacoco

      - name: Build server bootJar
        run: ./gradlew :server:bootJar -x test -x integrationTest

      - name: Enable Redis password for API smoke
        env:
          REDIS_PASSWORD: password
        run: |
          docker exec zhdj-ci-redis redis-cli CONFIG SET requirepass "$REDIS_PASSWORD"
          docker exec zhdj-ci-redis redis-cli -a "$REDIS_PASSWORD" ping

      - name: Start server for API smoke
        env:
          SPRING_PROFILES_ACTIVE: prod
          DATABASE_URL: jdbc:mysql://127.0.0.1:3306/zhdj?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          DATABASE_USERNAME: root
          DATABASE_PASSWORD: root
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_DATABASE: 0
          REDIS_PASSWORD: password
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: password
          APP_CORS_ALLOWED_ORIGINS: http://127.0.0.1:9000
          AI_KEY: dummy-key
          AUTH_TEST_CAPTCHA_CODE: CI8888
          LOG_PATH: server/build/logs
          TENCENT_CLOUD_COS_ENABLED: false
          AI_MCP_ENABLED: false
        run: |
          mkdir -p server/build/logs
          java -jar server/build/libs/server.jar > server/build/api-smoke-app.log 2>&1 &
          echo $! > server/build/api-smoke-app.pid

      - name: Wait for app
        id: wait-for-app
        continue-on-error: true
        run: bash .github/scripts/wait-for-app.sh http://127.0.0.1:9000/actuator/health

      - name: Check wait result
        if: steps.wait-for-app.outcome != 'success'
        run: exit 1

      - name: Seed smoke database
        if: steps.wait-for-app.outcome == 'success'
        env:
          MYSQL_PWD: root
        run: mysql -h127.0.0.1 -P3306 -uroot zhdj < .github/sql/ci-seed.sql

      - name: Seed smoke captcha
        if: steps.wait-for-app.outcome == 'success'
        env:
          REDIS_PASSWORD: password
          AUTH_TEST_CAPTCHA_CODE: CI8888
        run: |
          docker exec zhdj-ci-redis redis-cli -a "$REDIS_PASSWORD" SET captcha:ci-smoke "$AUTH_TEST_CAPTCHA_CODE" EX 300

      - name: Run OpenAPI smoke
        env:
          API_SMOKE_BASE_URL: http://127.0.0.1:9000
          AUTH_TEST_CAPTCHA_CODE: CI8888
          TEST_LOGIN_PASSWORD: Test@1234
          TEST_LOGIN_PASSPORT: ci_smoke_user
          TEST_SCHOOL_LOGIN_PASSPORT: ci_smoke_school
          TEST_MANAGER_LOGIN_PASSPORT: ci_smoke_manager
        run: node .github/scripts/api-smoke-openapi.mjs

      - name: Dump app logs on smoke failure
        if: failure()
        run: cat server/build/api-smoke-app.log || true

      - name: Stop API smoke app
        if: always()
        run: |
          if [ -f server/build/api-smoke-app.pid ]; then
            PID=$(cat server/build/api-smoke-app.pid)
            kill -TERM $PID 2>/dev/null || true
            rm -f server/build/api-smoke-app.pid
            for i in $(seq 1 10); do
              kill -0 $PID 2>/dev/null || break
              sleep 1
            done
            kill -9 $PID 2>/dev/null || true
          fi

      - name: Stop dependency containers
        if: always()
        run: docker rm -f zhdj-ci-mysql zhdj-ci-redis zhdj-ci-neo4j || true

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/jacoco/**
            server/build/api-smoke-app.log
          if-no-files-found: ignore
          retention-days: 7
