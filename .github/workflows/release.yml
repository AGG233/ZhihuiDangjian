name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  checks: read

env:
  REGISTRY: ghcr.io

jobs:
  # ── Stage 1: Build & Push Docker Image ───────────────────────────────
  release:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      checks: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Wait for CI checks before release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REQUIRED_CHECKS: |
            Compile & Format Check
            Unit Tests
            Integration & Smoke
            Coverage Verification
        shell: bash
        run: |
          set -euo pipefail

          check_required_runs() {
            local all_ready=true
            while IFS= read -r check_name; do
              [ -n "$check_name" ] || continue
              local encoded_name
              encoded_name="$(printf '%s' "$check_name" | jq -sRr @uri)"
              local run
              run="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?check_name=${encoded_name}" \
                | jq --arg name "$check_name" '[.check_runs[] | select(.name == $name) | {status, conclusion, started_at}] | sort_by(.started_at) | last // empty')"
              if [ -z "$run" ]; then
                echo "Waiting for check to appear: ${check_name}"
                all_ready=false
                continue
              fi

              local status conclusion
              status="$(jq -r '.status' <<<"$run")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
              if [ "$status" != "completed" ]; then
                echo "Waiting for check to complete: ${check_name} (${status})"
                all_ready=false
                continue
              fi
              if [ "$conclusion" != "success" ]; then
                echo "Required check failed: ${check_name} (${conclusion})"
                return 1
              fi
            done <<<"$REQUIRED_CHECKS"

            if [ "$all_ready" = true ]; then
              return 0
            fi
            return 2
          }

          deadline=$((SECONDS + 1800))
          while true; do
            runs_result=0
            check_required_runs || runs_result=$?

            if [ "$runs_result" -eq 0 ]; then
              echo "All required CI checks passed for ${SHA}; release may continue."
              exit 0
            fi
            if [ "$runs_result" -eq 1 ]; then
              echo "Release blocked because required CI checks did not pass."
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for required CI checks before release."
              exit 1
            fi
            sleep 15
          done

      - name: Validate version matches tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          GRADLE_VERSION=$(grep '^projectVersion=' gradle.properties | cut -d= -f2)
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "ERROR: Tag v$TAG_VERSION != gradle.properties $GRADLE_VERSION"
            exit 1
          fi
          echo "Version OK: v$GRADLE_VERSION"

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          VERSION=$(grep '^projectVersion=' gradle.properties | cut -d= -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using version: ${VERSION}"

      - name: Set lowercase image name
        id: image
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY_OWNER,,}/zhihuidangjian" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: true

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build application jar
        run: ./gradlew :server:bootJar --no-daemon -x test -x integrationTest -x spotlessCheck

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract Docker metadata
        id: docker-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push Docker image (GHCR)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.docker-meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=min

  trivy-scan:
    name: Scan Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ release ]
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY_OWNER,,}/zhihuidangjian" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ── Stage 2: Deploy to Server ────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: self-hosted
    needs: [ release ]
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Replace image registry with NJU mirror
        run: sed -i 's|ghcr.io|ghcr.nju.edu.cn|g' docker-compose.yml

      - name: Sync compose file
        working-directory: /www/server/panel/data/compose/test
        run: cp -f ${{ github.workspace }}/docker-compose.yml .

      - name: Deploy via docker-compose
        working-directory: /www/server/panel/data/compose/test
        run: |
          docker-compose pull
          docker-compose up -d
          docker image prune -f --filter "label=com.rauio.zhihuidangjian=true"

  # ── Summary ──────────────────────────────────────────────────────────
  summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [ release, deploy, trivy-scan ]
    if: always()
    steps:
      - name: Print release info
        run: |
          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ needs.release.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy | \`${{ needs.deploy.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trivy Scan | \`${{ needs.trivy-scan.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pipeline | build → release → deploy, scan |" >> "$GITHUB_STEP_SUMMARY"
