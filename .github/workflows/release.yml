name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Stage 1: Build & Push Docker Image ───────────────────────────────
  release:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      registry: ${{ steps.image.outputs.registry }}
      image_repository: ${{ steps.image.outputs.image_repository }}
      ghcr_image_repository: ${{ steps.image.outputs.ghcr_image_repository }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Validate version matches tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          GRADLE_VERSION=$(grep '^projectVersion=' gradle.properties | cut -d= -f2)
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "ERROR: Tag v$TAG_VERSION != gradle.properties $GRADLE_VERSION"
            exit 1
          fi
          echo "Version OK: v$GRADLE_VERSION"

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          VERSION=$(grep '^projectVersion=' gradle.properties | cut -d= -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using version: ${VERSION}"

      - name: Resolve Aliyun image
        id: image
        shell: bash
        env:
          ALIYUN_IMAGE_REPOSITORY: ${{ vars.ALIYUN_IMAGE_REPOSITORY }}
          ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ vars.ALIYUN_NAMESPACE }}
          ALIYUN_REPOSITORY: ${{ vars.ALIYUN_REPOSITORY }}
          ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in ALIYUN_REGISTRY_USERNAME ALIYUN_REGISTRY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: ${name} is required for Aliyun image publishing."
              exit 1
            fi
          done

          if [ -n "${ALIYUN_IMAGE_REPOSITORY:-}" ]; then
            IMAGE_REPOSITORY="${ALIYUN_IMAGE_REPOSITORY#https://}"
            IMAGE_REPOSITORY="${IMAGE_REPOSITORY#http://}"
            IMAGE_REPOSITORY="${IMAGE_REPOSITORY%/}"
            REGISTRY="${IMAGE_REPOSITORY%%/*}"
          else
            for name in ALIYUN_REGISTRY ALIYUN_NAMESPACE ALIYUN_REPOSITORY; do
              if [ -z "${!name:-}" ]; then
                echo "ERROR: ${name} is required when ALIYUN_IMAGE_REPOSITORY is not set."
                exit 1
              fi
            done

            REGISTRY="${ALIYUN_REGISTRY#https://}"
            REGISTRY="${REGISTRY#http://}"
            REGISTRY="${REGISTRY%/}"
            NAMESPACE="${ALIYUN_NAMESPACE#/}"
            NAMESPACE="${NAMESPACE%/}"
            REPOSITORY="${ALIYUN_REPOSITORY#/}"
            REPOSITORY="${REPOSITORY%/}"
            IMAGE_REPOSITORY="${REGISTRY}/${NAMESPACE}/${REPOSITORY}"
          fi

          if [ "$REGISTRY" = "$IMAGE_REPOSITORY" ]; then
            echo "ERROR: Aliyun image repository must include registry, namespace, and repository."
            exit 1
          fi

          GHCR_IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zhihuidangjian"

          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "image_repository=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image_repository=${GHCR_IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "Using image repository: ${IMAGE_REPOSITORY}"
          echo "Using GHCR image repository: ${GHCR_IMAGE_REPOSITORY}"

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: true

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build application jar
        run: ./gradlew :server:bootJar --no-daemon -x test -x integrationTest -x spotlessCheck

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Login to GHCR
        id: ghcr-login
        continue-on-error: true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract Docker metadata
        id: docker-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ steps.image.outputs.image_repository }}
            ${{ steps.ghcr-login.outcome == 'success' && steps.image.outputs.ghcr_image_repository || '' }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push Docker image (Aliyun ACR${{ steps.ghcr-login.outcome == 'success' && ' + GHCR' || ' (GHCR skipped)' }})
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image_repository }}:${{ steps.meta.outputs.version }}
            ${{ steps.image.outputs.image_repository }}:latest
            ${{ steps.ghcr-login.outcome == 'success' && format('{0}:{1}', steps.image.outputs.ghcr_image_repository, steps.meta.outputs.version) || '' }}
            ${{ steps.ghcr-login.outcome == 'success' && format('{0}:latest', steps.image.outputs.ghcr_image_repository) || '' }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=min

  trivy-scan:
    name: Scan Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ release ]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ needs.release.outputs.registry }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.release.outputs.image_repository }}:${{ needs.release.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ── Stage 2: Deploy to Server ────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: self-hosted
    needs: [ release ]
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout compose file
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="${{ github.workspace }}"
          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"
          git init -b temp-deploy
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }} --sparse
          git sparse-checkout set --no-cone docker-compose.yml
          git checkout FETCH_HEAD

      - name: Login to Aliyun Container Registry
        shell: bash
        run: |
          docker login ${{ needs.release.outputs.registry }} \
            -u '${{ secrets.ALIYUN_REGISTRY_USERNAME }}' \
            -p '${{ secrets.ALIYUN_REGISTRY_PASSWORD }}'

      - name: Sync compose file
        working-directory: /www/server/panel/data/compose/test
        run: cp -f ${{ github.workspace }}/docker-compose.yml .

      - name: Write deployed image
        working-directory: /www/server/panel/data/compose/test
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ needs.release.outputs.image_repository }}:${{ needs.release.outputs.version }}"
          touch .env
          if grep -q '^APP_IMAGE=' .env; then
            sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${IMAGE}|" .env
          else
            printf '\nAPP_IMAGE=%s\n' "$IMAGE" >> .env
          fi

      - name: Deploy via docker-compose
        working-directory: /www/server/panel/data/compose/test
        run: |
          docker-compose pull
          docker-compose up -d
          docker image prune -f --filter "label=com.rauio.zhihuidangjian=true"

  # ── Summary ──────────────────────────────────────────────────────────
  summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [ release, deploy, trivy-scan ]
    if: always()
    steps:
      - name: Print release info
        run: |
          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ needs.release.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ needs.release.outputs.image_repository }}:${{ needs.release.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| GHCR Image | \`${{ needs.release.outputs.ghcr_image_repository }}:${{ needs.release.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy | \`${{ needs.deploy.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trivy Scan | \`${{ needs.trivy-scan.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pipeline | build → release → deploy, scan |" >> "$GITHUB_STEP_SUMMARY"
