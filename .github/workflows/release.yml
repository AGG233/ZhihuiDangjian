name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ── Stage 1: Build & Push Docker Image ───────────────────────────────
  release:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      packages: write
      checks: read
      statuses: read
    needs: []
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for CI checks before release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REQUIRED_CHECKS: |
            Compile & Format Check
            Unit Tests
            Integration, Coverage & Smoke
            Codacy Static Code Analysis
            Codacy Diff Coverage
          REQUIRED_STATUSES: |
            CodeRabbit
        shell: bash
        run: |
          set -euo pipefail

          check_required_runs() {
            local all_ready=true
            while IFS= read -r check_name; do
              [ -n "$check_name" ] || continue
              local encoded_name
              encoded_name="$(printf '%s' "$check_name" | jq -sRr @uri)"
              local run
              run="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?check_name=${encoded_name}" \
                | jq --arg name "$check_name" '[.check_runs[] | select(.name == $name) | {status, conclusion, started_at}] | sort_by(.started_at) | last // empty')"
              if [ -z "$run" ]; then
                echo "Waiting for check to appear: ${check_name}"
                all_ready=false
                continue
              fi

              local status conclusion
              status="$(jq -r '.status' <<<"$run")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
              if [ "$status" != "completed" ]; then
                echo "Waiting for check to complete: ${check_name} (${status})"
                all_ready=false
                continue
              fi
              if [ "$conclusion" != "success" ]; then
                echo "Required check failed: ${check_name} (${conclusion})"
                return 1
              fi
            done <<<"$REQUIRED_CHECKS"

            if [ "$all_ready" = true ]; then
              return 0
            fi
            return 2
          }

          check_required_statuses() {
            local all_ready=true
            while IFS= read -r context_name; do
              [ -n "$context_name" ] || continue
              local state
              state="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/status" \
                | jq -r --arg name "$context_name" '.statuses[] | select(.context == $name) | .state' | head -n 1)"
              if [ -z "$state" ]; then
                echo "Waiting for status to appear: ${context_name}"
                all_ready=false
                continue
              fi
              if [ "$state" = "pending" ]; then
                echo "Waiting for status to complete: ${context_name}"
                all_ready=false
                continue
              fi
              if [ "$state" != "success" ]; then
                echo "Required status failed: ${context_name} (${state})"
                return 1
              fi
            done <<<"$REQUIRED_STATUSES"

            if [ "$all_ready" = true ]; then
              return 0
            fi
            return 2
          }

          deadline=$((SECONDS + 1800))
          while true; do
            runs_result=0
            check_required_runs || runs_result=$?
            statuses_result=0
            check_required_statuses || statuses_result=$?

            if [ "$runs_result" -eq 0 ] && [ "$statuses_result" -eq 0 ]; then
              echo "All required CI checks passed for ${SHA}; release may continue."
              exit 0
            fi
            if [ "$runs_result" -eq 1 ] || [ "$statuses_result" -eq 1 ]; then
              echo "Release blocked because required CI checks did not pass."
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for required CI checks before release."
              exit 1
            fi
            sleep 15
          done

      - name: Validate version matches tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          GRADLE_VERSION=$(grep '^projectVersion=' gradle.properties | cut -d= -f2)
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "ERROR: Tag v$TAG_VERSION != gradle.properties $GRADLE_VERSION"
            exit 1
          fi
          echo "Version OK: v$GRADLE_VERSION"

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          VERSION=$(grep '^projectVersion=' gradle.properties | cut -d= -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using version: ${VERSION}"

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY_OWNER,,}/zhihuidangjian" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push Docker image (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.docker-meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ── Stage 2: Deploy to Server ────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: self-hosted
    needs: [ release ]
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4

      - name: Replace image registry with NJU mirror
        run: sed -i 's|ghcr.io|ghcr.nju.edu.cn|g' docker-compose.yml

      - name: Sync compose file
        working-directory: /www/server/panel/data/compose/test
        run: cp -f ${{ github.workspace }}/docker-compose.yml .

      - name: Deploy via docker-compose
        working-directory: /www/server/panel/data/compose/test
        run: |
          docker-compose pull
          docker-compose up -d
          docker image prune -f --filter "label=com.rauio.zhihuidangjian=true"

  # ── Summary ──────────────────────────────────────────────────────────
  summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [ release, deploy ]
    if: always()
    steps:
      - name: Print release info
        run: |
          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ needs.release.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy | \`${{ needs.deploy.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pipeline | build → release → deploy |" >> "$GITHUB_STEP_SUMMARY"
