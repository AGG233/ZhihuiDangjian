name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ── Stage 1: Build & Push Docker Image ───────────────────────────────
  release:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      packages: write
    needs: []
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image_repository: ${{ steps.image.outputs.image_repository }}
      ghcr_image_repository: ${{ steps.image.outputs.ghcr_image_repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          VERSION=$(grep '^projectVersion=' gradle.properties | cut -d= -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using version: ${VERSION}"

      - name: Resolve Aliyun image
        id: image
        shell: bash
        env:
          ALIYUN_IMAGE_REPOSITORY: ${{ vars.ALIYUN_IMAGE_REPOSITORY }}
          ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ vars.ALIYUN_NAMESPACE }}
          ALIYUN_REPOSITORY: ${{ vars.ALIYUN_REPOSITORY }}
          ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in ALIYUN_REGISTRY_USERNAME ALIYUN_REGISTRY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: ${name} is required for Aliyun image publishing."
              exit 1
            fi
          done

          if [ -n "${ALIYUN_IMAGE_REPOSITORY:-}" ]; then
            IMAGE_REPOSITORY="${ALIYUN_IMAGE_REPOSITORY#https://}"
            IMAGE_REPOSITORY="${IMAGE_REPOSITORY#http://}"
            IMAGE_REPOSITORY="${IMAGE_REPOSITORY%/}"
            REGISTRY="${IMAGE_REPOSITORY%%/*}"
          else
            for name in ALIYUN_REGISTRY ALIYUN_NAMESPACE ALIYUN_REPOSITORY; do
              if [ -z "${!name:-}" ]; then
                echo "ERROR: ${name} is required when ALIYUN_IMAGE_REPOSITORY is not set."
                exit 1
              fi
            done

            REGISTRY="${ALIYUN_REGISTRY#https://}"
            REGISTRY="${REGISTRY#http://}"
            REGISTRY="${REGISTRY%/}"
            NAMESPACE="${ALIYUN_NAMESPACE#/}"
            NAMESPACE="${NAMESPACE%/}"
            REPOSITORY="${ALIYUN_REPOSITORY#/}"
            REPOSITORY="${REPOSITORY%/}"
            IMAGE_REPOSITORY="${REGISTRY}/${NAMESPACE}/${REPOSITORY}"
          fi

          if [ "$REGISTRY" = "$IMAGE_REPOSITORY" ]; then
            echo "ERROR: Aliyun image repository must include registry, namespace, and repository."
            exit 1
          fi

          GHCR_IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zhihuidangjian"

          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "image_repository=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image_repository=${GHCR_IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "Using image repository: ${IMAGE_REPOSITORY}"
          echo "Using GHCR image repository: ${GHCR_IMAGE_REPOSITORY}"

      - name: Build bootJar
        run: ./gradlew --no-daemon clean :server:bootJar -x test

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.image.outputs.image_repository }}
            ${{ steps.image.outputs.ghcr_image_repository }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push Docker image (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.ghcr_image_repository }}:${{ steps.meta.outputs.version }}
            ${{ steps.image.outputs.ghcr_image_repository }}:latest
          labels: ${{ steps.docker-meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

      - name: Build and push Docker image (Aliyun ACR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          # 阿里云 ACR 个人版不支持 OCI attestation manifest，需禁用 provenance/sbom
          provenance: false
          sbom: false
          tags: |
            ${{ steps.image.outputs.image_repository }}:${{ steps.meta.outputs.version }}
            ${{ steps.image.outputs.image_repository }}:latest
          labels: ${{ steps.docker-meta.outputs.labels }}
          platforms: linux/amd64

  # ── Stage 2: Deploy to Server ────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [ release ]
    # tag（定时/自动发版流程）或手动触发时均执行部署；
    # 手动触发使用当前 master 版本（覆盖 $version + latest 镜像），不 bump 版本、不打 tag
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          envs: APP_IMAGE=${{ needs.release.outputs.image_repository }}:${{ needs.release.outputs.version }}
          script: |
            set -euo pipefail
            cd /www/server/panel/data/compose/test

            # 一次性兼容：旧 compose 写死 ghcr.io 时改为支持 APP_IMAGE 变量
            if [ -f docker-compose.yml ] && grep -q 'image: ghcr.io/agg233/zhihuidangjian:latest' docker-compose.yml; then
              sed -i 's|image: ghcr.io/agg233/zhihuidangjian:latest|image: ${APP_IMAGE:-ghcr.io/agg233/zhihuidangjian:latest}|' docker-compose.yml
            fi

            # 写入本次部署的阿里云镜像地址
            touch .env
            if grep -q '^APP_IMAGE=' .env; then
              sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${APP_IMAGE}|" .env
            else
              echo "APP_IMAGE=${APP_IMAGE}" >> .env
            fi

            # 只拉取应用镜像，避免每次拉 neo4j/redis 大镜像
            docker-compose pull app
            docker-compose up -d
            docker image prune -f

  # ── Summary ──────────────────────────────────────────────────────────
  summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [ release, deploy ]
    if: always()
    steps:
      - name: Print release info
        run: |
          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ needs.release.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy | \`${{ needs.deploy.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pipeline | build → release → deploy |" >> "$GITHUB_STEP_SUMMARY"
