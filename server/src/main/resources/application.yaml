spring:
  application:
    name: server
  profiles:
    default: dev
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      connection-timeout: 2000
      minimum-idle: 4
      maximum-pool-size: 16
      idle-timeout: 30000
      username: ${DATABASE_USERNAME}
      password: ${DATABASE_PASSWORD}
    url: ${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/zhihuidangjian?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
  flyway:
    baseline-on-migrate: true
    # 兼容历史数据库：V5-V7 已被旧迁移占用，新迁移重编号为 V8-V10 后，
    # 需要忽略数据库中缺失的旧 V5-V7 记录，避免启动校验失败。
    ignore-migration-patterns: "*:missing"
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: ${REDIS_DATABASE}
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:password}
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${AI_KEY:dummy-key}
      chat:
        options:
          model: deepseek-chat
    dashscope:
      api-key: ${AI_EMBEDDING_KEY:${AI_KEY:dummy-key}}

# Sa-Token 配置
sa-token:
  token-name: Zhihui-Token
  token-prefix: Bearer
  timeout: 7200
  is-concurrent: false
  is-read-head: true
  is-read-body: false
  is-read-cookie: false
  is-log: false
  is-write-header: true
  # JWT 签名密钥（sa-token-jwt simple 模式）；生产环境必须显式注入 SA_TOKEN_JWT_SECRET_KEY，
  # 否则以占位符 CHANGE_ME_IN_PROD 启动会被启动时的 fail-fast 校验拦截。
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY:CHANGE_ME_IN_PROD}

app:
  content:
    carousel:
      chapter-id: 1145141919810

auth:
  captcha:
    test-code: ${AUTH_TEST_CAPTCHA_CODE:}

dromara:
  x-file-storage:
    tencent-cos:
      - platform: tencent-cos
        enable-storage: ${TENCENT_CLOUD_COS_ENABLED:true}
        secret-id: ${COS_SECRET_ID:}
        secret-key: ${COS_SECRET_KEY:}
        region: ${COS_REGION:ap-guangzhou}
        bucket: ${COS_BUCKET:}
        domain: ${COS_LINK:}
        base-path: /

server:
  port: 9000

logging:
  level:
    root: DEBUG
