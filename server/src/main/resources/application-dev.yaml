app:
  dev:
    default-user-id: 10086
    default-user-type: MANAGER
  cors:
    allowed-origins: http://localhost:*,http://127.0.0.1:*
  storage:
    local-root: ./uploads

server:
  port: 9000

spring:
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:neo4j}
  ai:
    openai:
      api-key: ${AI_KEY:dummy-key}

dromara:
  x-file-storage:
    tencent-cos:
      - platform: tencent-cos
        enable-storage: ${TENCENT_CLOUD_COS_ENABLED:false}
        secret-id: ${COS_SECRET_ID:}
        secret-key: ${COS_SECRET_KEY:}
        region: ${COS_REGION:ap-guangzhou}
        bucket-name: ${COS_BUCKET:}
        domain: ${COS_LINK:}
        base-path: /
    local-plus:
      - platform: local-dev
        enable-storage: true
        storage-path: ./uploads
        domain: http://localhost:9000/

logging:
  level:
    root: INFO
    com.rauio.smartdangjian: DEBUG
