app:
  dev:
    default-user-id: 1987026098687483905
    default-user-type: MANAGER
  cors:
    allowed-origins: http://localhost:*,http://127.0.0.1:*
  storage:
    local-root: ./uploads

server:
  port: 9000

spring:
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:neo4j}
  ai:
    openai:
      api-key: ${AI_KEY:dummy-key}

dromara:
  x-file-storage:
    tencent-cos:
      - platform: tencent-cos
        enable-storage: false
    local-plus:
      - platform: local-dev
        enable-storage: true
        storage-path: ./uploads
        domain: http://localhost:9000/

logging:
  level:
    root: INFO
    com.rauio.smartdangjian: DEBUG
