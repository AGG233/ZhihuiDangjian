services:
  mysql:
    image: mysql:8.4
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
    container_name: zhihuidangjian-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zhdj
    networks:
      - dev-network
    volumes:
      - mysql-data:/var/lib/mysql
      - /tmp/zhihuidangjian_backup.sql:/docker-entrypoint-initdb.d/backup.sql:ro

  redis:
    image: redis:7-alpine
    container_name: zhihuidangjian-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - dev-network

  app:
    image: zhihuidangjian:test3
    container_name: zhihuidangjian
    restart: unless-stopped
    networks:
      - dev-network
    depends_on:
      - mysql
      - redis
    ports:
      - "${APP_PORT:-9000}:9000"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - DATABASE_URL=${DATABASE_URL:-jdbc:mysql://mysql:3306/zhdj?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-root}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-root}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DATABASE=${REDIS_DATABASE:-0}
      - AI_KEY=${AI_KEY}
      - COS_SECRET_ID=${COS_SECRET_ID}
      - COS_SECRET_KEY=${COS_SECRET_KEY}
      - COS_REGION=${COS_REGION:-ap-guangzhou}
      - COS_BUCKET=${COS_BUCKET}
      - COS_LINK=${COS_LINK}
    volumes:
      - ./logs:/app/logs
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  dev-network:
    external: true

volumes:
  mysql-data:
