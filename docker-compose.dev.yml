services:
  mysql:
    image: mysql:8.4
    container_name: zhihuidangjian-mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhdj}
    volumes:
      - mysql-data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - zhihuidangjian

  redis:
    image: redis:7-alpine
    container_name: zhihuidangjian-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis-dev}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis-dev}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - zhihuidangjian

  neo4j:
    image: neo4j:5-community
    container_name: zhihuidangjian-neo4j
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USERNAME:-neo4j}", "-p", "${NEO4J_PASSWORD:-password}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password}
    volumes:
      - neo4j-data:/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    networks:
      - zhihuidangjian

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: zhihuidangjian:local-dev
    container_name: zhihuidangjian-app
    restart: no
    ports:
      - "${APP_PORT:-9000}:9000"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-zhdj}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-dev}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      AI_KEY: ${AI_KEY:-dummy-key}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_RATE_LIMIT_ENABLED: ${AI_RATE_LIMIT_ENABLED:-false}
      TENCENT_CLOUD_COS_ENABLED: ${TENCENT_CLOUD_COS_ENABLED:-false}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_LINK: ${COS_LINK:-}
      AI_MCP_ENABLED: ${AI_MCP_ENABLED:-false}
      AUTH_TEST_CAPTCHA_CODE: ${AUTH_TEST_CAPTCHA_CODE:-TEST8888}
      LOG_PATH: /app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    networks:
      - zhihuidangjian

networks:
  zhihuidangjian:
    driver: bridge

volumes:
  mysql-data:
  neo4j-data:
